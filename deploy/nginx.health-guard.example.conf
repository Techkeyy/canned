# Replace the placeholder only with an existing DNS name that resolves to this VPS.
# Install this as a dedicated server block; do not merge it into another app.
server {
    listen 443 ssl http2;
    server_name REPLACE_WITH_EXISTING_DEDICATED_HOST;

    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_EXISTING_DEDICATED_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_EXISTING_DEDICATED_HOST/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }
}
